[project]
name = "specalign-agent"
version = "0.1.0"
description = "SpecAlign: Multi-Agent PRD, Business Goals & TDD Alignment Auditor built with ADK"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk[gcp]>=2.0.0,<3.0.0",
    "google-cloud-aiplatform[evaluation,agent-engines]>=1.90.0",
    "a2a-sdk[http-server]>=0.2.0",
    "google-cloud-firestore>=2.19.0",
    "python-docx>=1.1.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
lint = [
    "ruff>=0.8.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0",
]

[dependency-groups]
dev = [
    "google-adk[eval]>=2.15.1",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.codespell]
ignore-words-list = "securty"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ty.rules]
# ADK 2.x marks ParallelAgent/SequentialAgent deprecated in favor of Workflow,
# which cannot yet be used as an LlmAgent sub-agent.
deprecated = "ignore"
